[package]
name = "pumpkin"
version.workspace = true
description = "Melon MC — High-performance Minecraft server core written in Rust"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[package.metadata.tauri-winres]
FileDescription = "Melon MC"
OriginalFilename = "melon.exe"
LegalCopyright = "Copyright (c) 2024-2026 Pumpkin MC Contributors, 2026 Melon MC Project"

[[bin]]
name = "melon"
path = "src/main.rs"

[dependencies]
pumpkin-core.workspace = true
pumpkin-wasm-host.workspace = true
pumpkin-config.workspace = true
pumpkin-data = { workspace = true, features = ["default"] }
pumpkin-util.workspace = true
pumpkin-world.workspace = true

rayon.workspace = true
rustls.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal"] }
tracing.workspace = true
console-subscriber = { workspace = true, optional = true }

[features]
console-subscriber = ["dep:console-subscriber"]
plugin-v0_2 = ["pumpkin-wasm-host/v0_2"]

[lints]
workspace = true
